<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0f" />
    <title>Emcük YTB - Resmi Platform</title>
    <meta name="description" content="VİCTOR REİS DERLER 😇 Hakan abinin resmi yayın ve topluluk platformu." />
    <link rel="icon" href="https://emcukytb.com.tr/ytlogo.png" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React ve ReactDOM CDN (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Firebase compat UMD (tarayıcıda global firebase sağlar) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Babel Standalone (JSX Çevirici) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root{
            --bg: #090a0f;
            --card: rgba(18,19,26,0.92);
            --primary: #6366f1;
            --accent: #ec4899;
            --muted: #94a3b8;
            --neon-green: #00ff7a;
            --neon-white: #ffffff;
            --neon-black: #000000;
            --glass-border: rgba(255,255,255,0.08);
        }

        *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{height:100%;overflow-x:hidden;width:100%}
        #root{min-height:100%}
        body{background:var(--bg); color:#f8fafc; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;min-height:100vh}
        img{max-width:100%;display:block}
        button{font-family:inherit}
        input,textarea{font-family:inherit;width:100%}

        .glass-card{
            background:var(--card);
            backdrop-filter: blur(12px);
            border-radius:18px;
            border:1px solid var(--glass-border);
            padding:16px;
            box-shadow:0 10px 30px rgba(0,0,0,0.6);
            max-width:100%;
        }

        header.glass-card{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
        .logo-row{display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0}
        .logo-row img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(99,102,241,0.4);animation:logoPulse 3s infinite}
        @keyframes logoPulse{
            0%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(99,102,241,0.15))}
            50%{transform:scale(1.03);filter:drop-shadow(0 0 16px rgba(236,72,153,0.18))}
            100%{transform:scale(1)}
        }

        nav{display:flex;gap:10px;align-items:center;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
        nav::-webkit-scrollbar{display:none}
        nav button{background:none;border:none;color:#cbd5e1;font-weight:600;padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;flex-shrink:0}
        nav button:hover{color:var(--primary)}
        nav .active{color:var(--primary);text-decoration:underline;text-underline-offset:6px}

        .btn-primary{
            background:linear-gradient(135deg,var(--primary),var(--accent));
            color:white;padding:10px 16px;border-radius:12px;border:none;cursor:pointer;font-weight:700;box-shadow:0 6px 18px rgba(99,102,241,0.2);
            transition:opacity .2s, transform .1s;
        }
        .btn-primary:disabled{opacity:0.5;cursor:not-allowed}
        .btn-primary:active:not(:disabled){transform:scale(0.98)}

        main{padding:28px 20px 140px;max-width:1200px;margin:0 auto;width:100%}

        .hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
        .hero .hero-left{flex:1;min-width:260px}
        .hero h1{font-size:34px;color:#ff79c6;margin-bottom:6px;word-break:break-word}
        .hero p.lead{color:#a5b4fc;font-size:18px;margin-bottom:10px}
        .hero-right{min-width:240px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;flex:1}

        .stats{display:flex;gap:10px;flex-wrap:wrap}
        .stat{background:rgba(10,10,30,0.5);padding:8px 12px;border-radius:12px;border:1px solid rgba(99,102,241,0.08);font-weight:700;color:#dbeafe}

        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}

        /* iframe responsive wrapper */
        .embed-wrap{width:100%;background:rgba(0,0,0,0.4);border-radius:14px;border:1px solid rgba(255,255,255,0.04);padding:10px}
        .responsive-iframe{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px}
        .responsive-iframe iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:12px}

        .about-card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,0.03)}
        .about-card p{color:#cbd5e1;line-height:1.5;font-size:14px;word-break:break-word}

        .chat-input-row{display:flex;gap:8px;margin-top:12px}
        .chat-input-row input{flex:1;min-width:0}
        .chat-input-row button{flex-shrink:0}

        .not-found{max-width:520px;margin:40px auto;text-align:center}

        /* Footer animations & cyberpunk text */
        footer.site-footer{
            position:fixed;
            left:0;right:0;bottom:0;
            transform:translateY(100%);
            opacity:0;
            transition:transform .5s cubic-bezier(.2,.9,.3,1),opacity .35s;
            z-index:60;
            pointer-events:none;
            padding-bottom:env(safe-area-inset-bottom,0);
            will-change:transform,opacity;
        }
        footer.site-footer.visible{
            transform:translateY(0);
            opacity:1;
            pointer-events:auto;
        }
        footer .footer-inner{
            display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;background:linear-gradient(90deg, rgba(0,0,0,0.6), rgba(5,5,10,0.55));backdrop-filter: blur(8px);border-top:1px solid rgba(255,255,255,0.03);flex-wrap:wrap
        }
        .marquee-left{display:flex;align-items:center;gap:12px;min-width:0}
        .marquee-left img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0}
        .marquee-left > div{min-width:0}
        .marquee-left > div > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .cyber-text{
            font-weight:900;
            font-size:16px;
            letter-spacing:1px;
            padding:6px 12px;border-radius:8px;
            background:linear-gradient(90deg,var(--neon-green),var(--neon-white),#7fffcb);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            text-shadow:0 0 8px rgba(0,255,122,0.12);
            animation:cyberShift 3s linear infinite;
            display:inline-block;
        }
        @keyframes cyberShift{
            0%{filter:drop-shadow(0 0 6px rgba(0,255,122,0.08))}
            50%{filter:drop-shadow(0 0 18px rgba(0,255,122,0.18))}
            100%{filter:drop-shadow(0 0 6px rgba(0,255,122,0.08))}
        }
        .footer-right small{color:#94a3b8;display:block}
        .footer-right .title{font-weight:800;color:#e6eefc}

        /* small responsive tweaks */
        @media (max-width:720px){
            .hero h1{font-size:26px}
            .hero p.lead{font-size:15px}
            .hero-right{width:100%;align-items:stretch;text-align:left}
            .hero-right .glass-card{text-align:left !important}
            .footer-inner{flex-direction:column;align-items:flex-start;gap:8px;padding:14px 16px}
            main{padding:20px 14px 160px}
            nav{width:100%;justify-content:flex-start}
        }

        @media (max-width:480px){
            .hero h1{font-size:22px}
            .stat{font-size:12px;padding:6px 10px}
            header.glass-card{padding:12px}
            .glass-card{padding:12px;border-radius:14px}
            .btn-primary{padding:9px 12px;font-size:14px}
        }

        /* extra accent text style (green/white/black switching) */
        .accent-line{
            display:inline-block;
            padding:6px 10px;border-radius:8px;font-weight:800;
            background:linear-gradient(90deg, #00ff7a 0%, #ffffff 50%, #000000 100%);
            background-size:200% 100%;
            -webkit-background-clip:text;background-clip:text;color:transparent;
            animation:accentMove 4s linear infinite;
        }
        @keyframes accentMove{
            0%{background-position:0% 0}
            100%{background-position:200% 0}
        }

        @media (prefers-reduced-motion: reduce){
            *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important}
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { createRoot } = ReactDOM;

        const channelData = {
            channelName: "Emcük YTB",
            channelHandle: "@EmcükYTB",
            adminEmail: "tvemcuk@gmail.com",
            ownerName: "Hakan",
            age: 38,
            device: "Samsung Galaxy Tab S9 Ultra + Scorpion 2 Pro Klavye Mouse",
            fps: "119.5",
            slogan: "SAYGIDA MECBUR SEVGİDE ÖZGÜRSÜNÜZ 💝",
            subscribers: "37,3 B",
            totalVideos: "1.219",
            profileImage: "https://st5.depositphotos.com/1915171/64694/v/450/depositphotos_646948286-stock-illustration-user-profile-icon-avatar-person.jpg",
            fallbackImage: "data:image/svg+xml;utf8," + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="100%" height="100%" fill="#1e1b2e"/><text x="50%" y="55%" font-size="42" text-anchor="middle" fill="#a78bfa" font-family="sans-serif">E</text></svg>'
            )
        };

        const firebaseConfig = {
          apiKey: "AIzaSyDFobHTVqG2dt54QGokkJWDBxBFuFOniYc",
          authDomain: "emcuk-ytb.firebaseapp.com",
          databaseURL: "https://emcuk-ytb-default-rtdb.firebaseio.com",
          projectId: "emcuk-ytb",
          storageBucket: "emcuk-ytb.firebasestorage.app",
          messagingSenderId: "583409310450",
          appId: "1:583409310450:web:b14cf43e280ba87f9c8e6b"
        };

        // Firebase'i güvenli şekilde başlat (hot-reload / çift init hatasını önler)
        let db = null;
        try {
            const app = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
            db = firebase.database(app);
        } catch (err) {
            console.error("Firebase başlatma hatası:", err);
        }

        const VALID_PATHS = ['/kanal', '/hakkinda', '/chat', '/u/0/stream-yt', '/w/9/videolar-hepsi', '/profil'];
        const KEY_TTL_MS = 10 * 60 * 1000; // 21 haneli anahtarın geçerlilik süresi: 10 dakika
        const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function generate21DigitKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < 21; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function scanMessageForBots(text) {
            if (!text || typeof text !== 'string') return false;
            const spamKeywords = ['bedava uc', 'hile', 'hack', 'kazandınız', 'tıkla', 'free uc', 'nitro'];
            const lowerText = text.toLowerCase();
            for (let word of spamKeywords) {
                if (lowerText.includes(word)) return false;
            }
            return true;
        }

        async function fetchLiveYouTubeData() {
            // NOT: Gerçek canlı veri için YouTube Data API entegrasyonu gerekir.
            // Şimdilik güvenli varsayılan (mock) veri döndürülüyor.
            try {
                return {
                    isLive: true,
                    viewers: "1,540",
                    title: "Hakan İle Canlı WOW Keyfi - VİCTOR REİS DERLER 😇",
                    subscribers: channelData.subscribers,
                    totalVideos: channelData.totalVideos
                };
            } catch (err) {
                console.error("YouTube verisi alınamadı:", err);
                return null;
            }
        }

        // --- SPA Yönlendirme: Hash tabanlı router ---
        // GitHub Pages gibi statik sunucularda alt yollarda F5/doğrudan erişimde 404 oluşmasını
        // tamamen engeller çünkü sunucu her zaman sadece kök index.html'i döndürür; '#' sonrası
        // kısım tarayıcıda kalır ve sunucuya hiç gitmez. history (geri/ileri) davranışı korunur.
        function getCurrentHashPath() {
            const h = window.location.hash;
            if (!h || h === '#' || h === '#/') return '/kanal';
            return h.slice(1);
        }

        function NotFound({ onHome }) {
            return (
                <div className="glass-card not-found">
                    <h2 style={{color:'#fb7185'}}>404 - Sayfa Bulunamadı</h2>
                    <p style={{color:'#94a3b8', marginTop:8}}>Aradığınız sayfa mevcut değil kankam.</p>
                    <button className="btn-primary" style={{marginTop:14}} onClick={onHome}>Ana Sayfaya Dön</button>
                </div>
            );
        }

        function App(){
            const [path, setPath] = useState(getCurrentHashPath());
            const [user, setUser] = useState(null);
            const [emailInput, setEmailInput] = useState("");
            const [keyInput, setKeyInput] = useState("");
            const [step, setStep] = useState(1);
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState("");
            const [ytData, setYtData] = useState(null);
            const [captchaVerified, setCaptchaVerified] = useState(false);
            const [footerVisible, setFooterVisible] = useState(false);
            const [requestingKey, setRequestingKey] = useState(false);
            const [verifyingKey, setVerifyingKey] = useState(false);
            const [sendingMsg, setSendingMsg] = useState(false);

            const chatScrollRef = useRef(null);
            const tickingRef = useRef(false);

            // İlk yüklemede hash yoksa URL'yi netleştir (yeni geçmiş kaydı eklemeden)
            useEffect(() => {
                if (!window.location.hash) {
                    window.history.replaceState(null, '', window.location.pathname + window.location.search + '#/kanal');
                }
            }, []);

            // Hash değişikliklerini dinle (geri/ileri tuşları dahil)
            useEffect(() => {
                const onHashChange = () => setPath(getCurrentHashPath());
                window.addEventListener('hashchange', onHashChange);
                return () => window.removeEventListener('hashchange', onHashChange);
            }, []);

            // Kullanıcı oturumunu localStorage'dan güvenli şekilde yükle
            useEffect(() => {
                try {
                    const saved = localStorage.getItem('emcuk_user');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.email) setUser(parsed);
                    }
                } catch (err) {
                    console.warn("Kayıtlı oturum okunamadı, temizleniyor:", err);
                    try { localStorage.removeItem('emcuk_user'); } catch (e) {}
                }

                let mounted = true;
                fetchLiveYouTubeData().then(d => { if (mounted) setYtData(d); });
                return () => { mounted = false; };
            }, []);

            // Realtime chat mesajları: mükerrer kayıt önleme + limit + silme senkronizasyonu
            useEffect(() => {
                if (!db) return;
                const msgRef = db.ref('chat_messages').orderByChild('timestamp').limitToLast(200);
                const seenIds = new Set();

                const handleAdd = snap => {
                    if (!snap || seenIds.has(snap.key)) return;
                    seenIds.add(snap.key);
                    const val = snap.val() || {};
                    setMessages(prev => {
                        if (prev.some(m => m.id === snap.key)) return prev;
                        const next = [...prev, {
                            id: snap.key,
                            name: val.name || 'Anonim',
                            email: val.email || '',
                            text: val.text || '',
                            timestamp: val.timestamp || Date.now()
                        }];
                        next.sort((a, b) => a.timestamp - b.timestamp);
                        return next;
                    });
                };

                const handleRemove = snap => {
                    if (!snap) return;
                    seenIds.delete(snap.key);
                    setMessages(prev => prev.filter(m => m.id !== snap.key));
                };

                msgRef.on('child_added', handleAdd);
                msgRef.on('child_removed', handleRemove);

                return () => {
                    msgRef.off('child_added', handleAdd);
                    msgRef.off('child_removed', handleRemove);
                };
            }, []);

            // Yeni mesaj geldiğinde sohbeti otomatik en alta kaydır
            useEffect(() => {
                if (chatScrollRef.current) {
                    chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
                }
            }, [messages]);

            // Scroll -> footer görünürlüğü (throttled, performanslı)
            useEffect(() => {
                const onScroll = () => {
                    if (tickingRef.current) return;
                    tickingRef.current = true;
                    window.requestAnimationFrame(() => {
                        const nearBottom = (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 180);
                        setFooterVisible(nearBottom);
                        tickingRef.current = false;
                    });
                };
                window.addEventListener('scroll', onScroll, { passive: true });
                onScroll();
                return () => window.removeEventListener('scroll', onScroll);
            }, []);

            const navigate = useCallback((url) => {
                if (window.location.hash.slice(1) === url) return;
                window.location.hash = url;
                window.scrollTo(0, 0);
            }, []);

            const handleRequestKey = async (e) => {
                e.preventDefault();
                if (!db) { alert("⚠️ Veritabanı bağlantısı kurulamadı, lütfen sayfayı yenileyin."); return; }
                if (!captchaVerified) { alert("⚠️ Lütfen reCAPTCHA (Robot Değilim) doğrulamasını tamamlayın!"); return; }
                const trimmedEmail = emailInput.trim();
                if (!trimmedEmail || !EMAIL_REGEX.test(trimmedEmail)) { alert("⚠️ Lütfen geçerli bir e-posta adresi girin."); return; }
                if (requestingKey) return;

                setRequestingKey(true);
                try {
                    const generatedKey = generate21DigitKey();
                    const safe = trimmedEmail.replace(/[.#$\/\[\]]/g, '_');
                    await db.ref(`auth_keys/${safe}`).set({ key: generatedKey, time: Date.now(), email: trimmedEmail });
                    alert(`[Güvenlik] ${trimmedEmail} adresine 21 haneli anahtar üretildi (10 dakika geçerli)!\n\nTest Anahtarınız: ${generatedKey}`);
                    setStep(2);
                } catch (err) {
                    console.error("Anahtar üretme hatası:", err);
                    alert("❌ Anahtar üretilirken bir hata oluştu. Lütfen tekrar deneyin.");
                } finally {
                    setRequestingKey(false);
                }
            };

            const handleVerifyKey = async (e) => {
                e.preventDefault();
                if (!db) { alert("⚠️ Veritabanı bağlantısı kurulamadı, lütfen sayfayı yenileyin."); return; }
                const trimmedKey = keyInput.trim();
                if (!trimmedKey) return;
                if (verifyingKey) return;

                setVerifyingKey(true);
                try {
                    const safe = emailInput.trim().replace(/[.#$\/\[\]]/g, '_');
                    const snap = await db.ref(`auth_keys/${safe}`).once('value');
                    const data = snap.exists() ? snap.val() : null;

                    if (!data || data.key !== trimmedKey) {
                        alert("❌ Hatalı 21 haneli anahtar!");
                        return;
                    }
                    const age = Date.now() - (data.time || 0);
                    if (age > KEY_TTL_MS) {
                        alert("⏰ Anahtarın süresi dolmuş. Lütfen yeni bir anahtar isteyin.");
                        setStep(1);
                        setKeyInput("");
                        return;
                    }

                    const userData = { email: emailInput.trim(), name: emailInput.split('@')[0], joined: new Date().toLocaleDateString('tr-TR') };
                    setUser(userData);
                    try { localStorage.setItem('emcuk_user', JSON.stringify(userData)); } catch (err) { console.warn("Oturum kaydedilemedi:", err); }

                    // Tek kullanımlık anahtarı temizle
                    db.ref(`auth_keys/${safe}`).remove().catch(() => {});

                    alert("Giriş başarılı! Hoş geldin kankam 💘");
                    navigate('/profil');
                } catch (err) {
                    console.error("Doğrulama hatası:", err);
                    alert("❌ Doğrulama sırasında bir hata oluştu. Lütfen tekrar deneyin.");
                } finally {
                    setVerifyingKey(false);
                }
            };

            const handleLogout = () => {
                setUser(null);
                try { localStorage.removeItem('emcuk_user'); } catch (err) {}
                setStep(1); setEmailInput(''); setKeyInput(''); setCaptchaVerified(false);
                navigate('/chat');
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!db) { alert("⚠️ Veritabanı bağlantısı kurulamadı."); return; }
                const trimmed = newMessage.trim();
                if (!trimmed || !user || sendingMsg) return;
                if (trimmed.length > 500) { alert("✋ Mesaj çok uzun (maksimum 500 karakter)."); return; }
                if (!scanMessageForBots(trimmed)) { alert("🛡️ Bot Tarama Sistemi: Mesajınız güvenlik filtresine takıldı!"); return; }

                setSendingMsg(true);
                try {
                    await db.ref('chat_messages').push({
                        name: user.name || 'Anonim',
                        email: user.email || '',
                        text: trimmed,
                        timestamp: (firebase.database.ServerValue && firebase.database.ServerValue.TIMESTAMP) || Date.now()
                    });
                    setNewMessage('');
                } catch (err) {
                    console.error("Mesaj gönderme hatası:", err);
                    alert("❌ Mesaj gönderilemedi. Lütfen tekrar deneyin.");
                } finally {
                    setSendingMsg(false);
                }
            };

            const deleteMsg = async (id) => {
                if (!db) return;
                if (user?.email !== channelData.adminEmail) { alert("Bu işlem için yetkiniz yok!"); return; }
                try {
                    await db.ref(`chat_messages/${id}`).remove();
                } catch (err) {
                    console.error("Mesaj silinemedi:", err);
                    alert("❌ Mesaj silinirken bir hata oluştu.");
                }
            };

            const isKnownPath = path === '/' || VALID_PATHS.includes(path);

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="glass-card m-4 p-4">
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
                            <div style={{display:'flex',alignItems:'center',gap:12}}>
                                <div className="logo-row" onClick={()=>navigate('/kanal')}>
                                    <img src={channelData.profileImage} alt="logo" onError={(e)=>{ e.target.onerror=null; e.target.src = channelData.fallbackImage; }} />
                                </div>
                                <div>
