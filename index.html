            --bg:#000000;
            --bg-soft:#0a0a0a;
            --card: rgba(15,15,15,0.94);
            --card-soft: rgba(255,255,255,0.03);
            --green:#00ff85;
            --green-dim:#00c853;
            --green-glow: rgba(0,255,133,0.25);
            --white:#ffffff;
            --muted:#a1a1aa;
            --border: rgba(0,255,133,0.14);
            --danger:#ff4d4d;
            --font-body:'Plus Jakarta Sans',sans-serif;
            --font-mono:'JetBrains Mono',monospace;

        *{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-body);-webkit-tap-highlight-color:transparent}
        html,body{height:100%;overflow-x:hidden;width:100%;background:var(--bg)}

        img{max-width:100%;display:block}
        button{font-family:inherit;cursor:pointer}
        input{font-family:inherit;width:100%}
        a{color:inherit}

            background:var(--card);

            border:1px solid var(--border);
            box-shadow:0 10px 34px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,255,133,0.02) inset;
        }

        /* ---------- Live pulsing dot ---------- */
        .live-dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;position:relative;flex-shrink:0}
        .live-dot::after{
            content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--green);
            animation:livePulse 1.6s ease-out infinite;
        }
        @keyframes livePulse{
            0%{transform:scale(0.6);opacity:0.9}
            100%{transform:scale(2.4);opacity:0}
        }
        .live-pill{
            display:inline-flex;align-items:center;gap:6px;background:rgba(0,255,133,0.1);
            border:1px solid var(--border);padding:5px 12px;border-radius:999px;
            font-family:var(--font-mono);font-weight:700;font-size:12px;letter-spacing:0.5px;color:var(--green);
        }

        /* ---------- Header ---------- */
        header.topbar{
            position:sticky;top:0;z-index:80;
            display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;

            background:rgba(0,0,0,0.75);backdrop-filter:blur(16px);

        .brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0}
        .brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--green);box-shadow:0 0 14px var(--green-glow)}

        nav.pillnav button:hover{color:var(--white)}
        nav.pillnav button.active{color:#000;background:var(--green);box-shadow:0 0 16px var(--green-glow)}

        /* ---------- Marquee ---------- */

        .chat-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
        .chat-avatar.broadcaster{border-color:var(--green);box-shadow:0 0 8px var(--green-glow)}

        .profile-card{max-width:480px;margin:20px auto;text-align:center}

        footer.site-footer{
            position:fixed;left:0;right:0;bottom:0;transform:translateY(100%);opacity:0;
            transition:transform .5s cubic-bezier(.2,.9,.3,1),opacity .35s;z-index:60;pointer-events:none;

        footer.site-footer.visible{transform:translateY(0);opacity:1;pointer-events:auto}
        footer .footer-inner{
            display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;
            background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);border-top:1px solid var(--border);flex-wrap:wrap
        }
        .footer-left{display:flex;align-items:center;gap:10px;min-width:0}
        .footer-left img{width:38px;height:38px;border-radius:8px;object-fit:cover;flex-shrink:0}
        .footer-left .t1{font-weight:900;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .footer-left .t2{color:var(--muted);font-size:11px}
        .cyber-text{

            text-shadow:0 0 10px var(--green-glow);

        /* ---------- floating action ---------- */
        .fab{
            position:fixed;right:18px;bottom:18px;z-index:70;width:54px;height:54px;border-radius:50%;
            background:var(--green);color:#000;display:flex;align-items:center;justify-content:center;font-size:22px;
            box-shadow:0 8px 24px var(--green-glow);border:none;animation:fabFloat 2.6s ease-in-out infinite;
        }
        @keyframes fabFloat{0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}}

        @media (max-width:720px){
            .stream-meta h1{font-size:19px}
            main{padding:18px 12px 100px}
            .footer-inner{padding:12px 14px}
        }
        @media (max-width:480px){
            header.topbar{padding:10px 12px}
            .brand .name{font-size:15px}
            .glass{border-radius:14px}
        }

        @media (prefers-reduced-motion: reduce){
            *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important}
        }
    </style>
</head>

        async function fetchLiveYouTubeData() {
            // NOT: Gerçek zamanlı YouTube verisi için YouTube Data API v3 (sunucu taraflı anahtarla)
            // gerekir. API anahtarını tarayıcıya koymak kota istismarına açık kapı bırakır, bu yüzden

        function getCurrentHashPath() {
            const h = window.location.hash;
            if (!h || h === '#' || h === '#/') return '/canli';
            return h.slice(1);
        }

        // ---------- Sayaç animasyonu (0 -> hedef) ----------
        function useCountUp(target, duration = 1100) {
            const [value, setValue] = useState(0);
            useEffect(() => {
                let raf;
                const start = performance.now();
                const from = 0;
                const tick = (now) => {
                    const p = Math.min(1, (now - start) / duration);
                    const eased = 1 - Math.pow(1 - p, 3);
                    setValue(Math.round(from + (target - from) * eased));
                    if (p < 1) raf = requestAnimationFrame(tick);
                };
                raf = requestAnimationFrame(tick);
                return () => raf && cancelAnimationFrame(raf);
            }, [target]);
            return value;
        }

        // ---------- Scroll ile beliren (reveal) kapsayıcı ----------
        function Reveal({ children, className = "", delay = 0 }) {
            const ref = useRef(null);
            const [inView, setInView] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver((entries) => {
                    entries.forEach(entry => { if (entry.isIntersecting) { setInView(true); obs.disconnect(); } });
                }, { threshold: 0.15 });
                obs.observe(el);
                return () => obs.disconnect();
            }, []);
            return (
                <div ref={ref} className={`reveal ${inView ? 'in' : ''} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
                    {children}
                </div>
            );
        }

        function NotFound({ onHome }) {
            return (
                <Reveal>
                    <div className="glass not-found" style={{ padding: 24 }}>
                        <h2 style={{ color: 'var(--danger)' }}>404 — Sayfa Bulunamadı</h2>
                        <p style={{ color: 'var(--muted)', marginTop: 8 }}>Aradığınız sayfa mevcut değil kankam.</p>
                        <button className="btn" style={{ marginTop: 16 }} onClick={onHome}>Canlı Yayına Dön</button>
                    </div>
                </Reveal>
            );
        }

        function App() {
            const [path, setPath] = useState(getCurrentHashPath());
            const [user, setUser] = useState(null);
            const [emailInput, setEmailInput] = useState("");
            const [honeypot, setHoneypot] = useState("");
            const [joining, setJoining] = useState(false);

            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState("");
            const [sendHoneypot, setSendHoneypot] = useState("");
            const [sendingMsg, setSendingMsg] = useState(false);
            const [cooldownPct, setCooldownPct] = useState(0);

            const [isBroadcaster, setIsBroadcaster] = useState(false);
            const [ytData, setYtData] = useState(null);
            const [footerVisible, setFooterVisible] = useState(false);

            const chatScrollRef = useRef(null);
            const tickingRef = useRef(false);
            const lastSendRef = useRef(0);
            const cooldownTimerRef = useRef(null);

            const subsCount = useCountUp(channelData.subscribersNum);
            const videosCount = useCountUp(channelData.totalVideosNum);
            const liveViewersCount = useCountUp(ytData && ytData.isLive ? ytData.viewers : 0);

            // İlk yüklemede hash yoksa netleştir
            useEffect(() => {
                if (!window.location.hash) {
                    window.history.replaceState(null, '', window.location.pathname + window.location.search + '#/canli');
                }
            }, []);

            useEffect(() => {
                const onHashChange = () => setPath(getCurrentHashPath());
                window.addEventListener('hashchange', onHashChange);
                return () => window.removeEventListener('hashchange', onHashChange);
            }, []);

            // Oturumu güvenli şekilde yükle
            useEffect(() => {
                try {
                    const saved = localStorage.getItem('emcuk_user');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.email) setUser(parsed);
                    }
                } catch (err) {
                    console.warn("Kayıtlı oturum okunamadı:", err);
                    try { localStorage.removeItem('emcuk_user'); } catch (e) {}
                }
                let mounted = true;
                fetchLiveYouTubeData().then(d => { if (mounted) setYtData(d); });
                return () => { mounted = false; };
            }, []);

            // Realtime sohbet: mükerrer engelleme + silme senkronu + limit
            useEffect(() => {
                if (!db) return;
                const msgRef = db.ref('chat_messages').orderByChild('timestamp').limitToLast(200);
                const seenIds = new Set();

                const handleAdd = snap => {
                    if (!snap || seenIds.has(snap.key)) return;
                    seenIds.add(snap.key);
                    const val = snap.val() || {};
                    setMessages(prev => {
                        if (prev.some(m => m.id === snap.key)) return prev;
                        const next = [...prev, {
                            id: snap.key,
                            name: val.name || 'Anonim',
                            email: val.email || '',
                            text: val.text || '',
                            role: val.role || 'user',
                            timestamp: val.timestamp || Date.now()
                        }];
                        next.sort((a, b) => a.timestamp - b.timestamp);
                        return next;
                    });
                };
                const handleRemove = snap => {
                    if (!snap) return;
                    seenIds.delete(snap.key);
                    setMessages(prev => prev.filter(m => m.id !== snap.key));
                };

                msgRef.on('child_added', handleAdd);
                msgRef.on('child_removed', handleRemove);
                return () => {
                    msgRef.off('child_added', handleAdd);
                    msgRef.off('child_removed', handleRemove);
                };
            }, []);

            useEffect(() => {
                if (chatScrollRef.current) chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
            }, [messages]);

            // Footer scroll görünürlüğü (throttled)
            useEffect(() => {
                const onScroll = () => {
                    if (tickingRef.current) return;
                    tickingRef.current = true;
                    window.requestAnimationFrame(() => {
                        const nearBottom = (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 160);
                        setFooterVisible(nearBottom);
                        tickingRef.current = false;
                    });
                };
                window.addEventListener('scroll', onScroll, { passive: true });
                onScroll();
                return () => window.removeEventListener('scroll', onScroll);
            }, []);

            // Kozmetik "cracke karşı" önlemler — GERÇEK GÜVENLİK DEĞİLDİR, sadece caydırıcıdır.
            // Not: Tarayıcı JS'i asla tam gizlenemez; kaynak kodu her zaman görüntülenebilir.
            useEffect(() => {
                const blockContext = (e) => e.preventDefault();
                const blockKeys = (e) => {
                    const k = e.key;
                    if (k === 'F12') { e.preventDefault(); return; }
                    if (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C')) { e.preventDefault(); return; }
                    if (e.ctrlKey && k === 'U') { e.preventDefault(); return; }
                };
                document.addEventListener('contextmenu', blockContext);
                document.addEventListener('keydown', blockKeys);
                return () => {
                    document.removeEventListener('contextmenu', blockContext);
                    document.removeEventListener('keydown', blockKeys);
                };
            }, []);

            // Gönder butonu bekleme (cooldown) çubuğu
            useEffect(() => {
                if (cooldownTimerRef.current) clearInterval(cooldownTimerRef.current);
                cooldownTimerRef.current = setInterval(() => {
                    const elapsed = Date.now() - lastSendRef.current;
                    const pct = Math.max(0, Math.min(100, (elapsed / MESSAGE_COOLDOWN_MS) * 100));
                    setCooldownPct(pct);
                }, 100);
                return () => clearInterval(cooldownTimerRef.current);
            }, []);

            const navigate = useCallback((url) => {
                if (window.location.hash.slice(1) === url) return;
                window.location.hash = url;
                window.scrollTo(0, 0);
            }, []);

            const handleJoin = async (e) => {
                e.preventDefault();
                if (honeypot) return; // bot tuzağı tetiklendi, sessizce durdur
                const trimmed = emailInput.trim();
                if (!trimmed || !EMAIL_REGEX.test(trimmed)) { alert("⚠️ Lütfen geçerli bir e-posta adresi girin."); return; }
                if (joining) return;
                setJoining(true);
                try {
                    const userData = { email: trimmed, name: trimmed.split('@')[0], joined: new Date().toLocaleDateString('tr-TR') };
                    setUser(userData);
                    try { localStorage.setItem('emcuk_user', JSON.stringify(userData)); } catch (err) {}
                    if (db) {
                        const safe = trimmed.replace(/[.#$\/\[\]]/g, '_');
                        db.ref(`chat_users/${safe}`).update({ email: trimmed, lastSeen: Date.now() }).catch(() => {});
                        db.ref(`chat_users/${safe}/firstSeen`).transaction(v => v || Date.now()).catch(() => {});
                    }
                } finally {
                    setJoining(false);
                }
            };

            const handleLogout = () => {
                setUser(null);
                setIsBroadcaster(false);
                try { localStorage.removeItem('emcuk_user'); } catch (err) {}
                setEmailInput('');
                navigate('/canli');
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (sendHoneypot) return; // bot tuzağı
                if (!db) { alert("⚠️ Veritabanı bağlantısı kurulamadı."); return; }
                const trimmed = newMessage.trim();
                if (!trimmed || !user || sendingMsg) return;

                // Gizli yayıncı kodu kontrolü — asla veritabanına gönderilmez, kimse göremez
                if (trimmed === BROADCASTER_CODE) {
                    setIsBroadcaster(prev => !prev);
                    setNewMessage('');
                    alert(isBroadcaster ? "Yayıncı modu kapatıldı." : "🔴 Yayıncı modu etkinleştirildi (sadece sende görünür).");
                    return;
                }

                // DDoS/spam bariyeri: minimum gönderim aralığı
                const now = Date.now();
                if (now - lastSendRef.current < MESSAGE_COOLDOWN_MS) {
                    return;
                }
                if (trimmed.length > MAX_MESSAGE_LEN) { alert("✋ Mesaj çok uzun (maksimum 500 karakter)."); return; }
                if (!scanMessageForBots(trimmed)) { alert("🛡️ Bot Tarama Sistemi: Mesajınız güvenlik filtresine takıldı!"); return; }

                setSendingMsg(true);
                try {
                    await db.ref('chat_messages').push({
                        name: user.name || 'Anonim',
                        email: user.email || '',
                        text: trimmed,
                        role: isBroadcaster ? 'broadcaster' : 'user',
                        timestamp: (firebase.database.ServerValue && firebase.database.ServerValue.TIMESTAMP) || Date.now()
                    });
                    lastSendRef.current = Date.now();
                    setNewMessage('');
                } catch (err) {
                    console.error("Mesaj gönderme hatası:", err);
                    alert("❌ Mesaj gönderilemedi. Lütfen tekrar deneyin.");
                } finally {
                    setSendingMsg(false);
                }
            };

            const deleteMsg = async (id) => {
                if (!db || !isBroadcaster) return;
                try { await db.ref(`chat_messages/${id}`).remove(); } catch (err) { console.error(err); }
            };

            const isKnownPath = VALID_PATHS.includes(path);
            const cooldownActive = cooldownPct < 100;

            return (
                <div>
                    <header className="topbar">
                        <div className="brand" onClick={() => navigate('/canli')}>
                            <img src={channelData.logo} alt="logo" onError={(e) => { e.target.onerror = null; e.target.src = channelData.fallbackLogo; }} />
                            <div>
                                <div className="name">{channelData.channelName}</div>
                                <div className="tag">{channelData.channelHandle}</div>
                            </div>
                        </div>
                        <nav className="pillnav">
                            <button onClick={() => navigate('/canli')} className={path === '/canli' ? 'active' : ''}>🔴 Canlı Yayın</button>
                            <button onClick={() => navigate('/hakkinda')} className={path === '/hakkinda' ? 'active' : ''}>Hakkında</button>
                            <button onClick={() => navigate('/videolar')} className={path === '/videolar' ? 'active' : ''}>Videolar</button>
                            <button onClick={() => navigate('/profil')} className={path === '/profil' ? 'active' : ''}>Profil</button>
                        </nav>
                    </header>

                    <div className="marquee-wrap">
                        <div className="marquee-track">
                            <span>🟢 CANLI YAYIN AKTİF</span>
                            <span>👥 {channelData.subscribersNum.toLocaleString('tr-TR')} ABONE</span>
                            <span>🎬 {channelData.totalVideosNum.toLocaleString('tr-TR')} VİDEO</span>
                            <span>🕗 HER AKŞAM 20:00'DE CANLI</span>
                            <span>💚 ABONE OLSANA KANKAM</span>
                            <span>🟢 CANLI YAYIN AKTİF</span>
                            <span>👥 {channelData.subscribersNum.toLocaleString('tr-TR')} ABONE</span>
                            <span>🎬 {channelData.totalVideosNum.toLocaleString('tr-TR')} VİDEO</span>
                            <span>🕗 HER AKŞAM 20:00'DE CANLI</span>
                            <span>💚 ABONE OLSANA KANKAM</span>
                        </div>
                    </div>

                    <main>
                        {!isKnownPath && <NotFound onHome={() => navigate('/canli')} />}

                        {path === '/canli' && (
                            <div className="live-grid">
                                <Reveal>
                                    <div className="video-wrap">
                                        <div className="responsive-iframe">
                                            <iframe src="https://www.youtube.com/embed/ANPQvjK7Rio" title="Emcük YTB Canlı Yayın" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerPolicy="strict-origin-when-cross-origin" allowFullScreen></iframe>
                                        </div>
                                        <div className="stream-meta">
                                            <div className="live-pill" style={{ marginBottom: 10 }}><span className="live-dot"></span> CANLI</div>
                                            <h1>Hakan İle Canlı WOW Keyfi - VİCTOR REİS DERLER 😇</h1>
                                            <div className="counters">
                                                <div className="counter-chip"><div className="num">{subsCount.toLocaleString('tr-TR')}</div><div className="lbl">Abone</div></div>
                                                <div className="counter-chip"><div className="num">{videosCount.toLocaleString('tr-TR')}</div><div className="lbl">Video</div></div>
                                                <div className="counter-chip"><div className="num">{liveViewersCount.toLocaleString('tr-TR')}</div><div className="lbl">Canlı İzleyici</div></div>
                                            </div>
                                        </div>
                                    </div>
                                </Reveal>

                                <Reveal delay={100}>
                                    <div className="glass chat-panel">
                                        <div className="chat-head">
                                            <h3>💬 Canlı Sohbet</h3>
                                            <div className="live-pill"><span className="live-dot"></span> {messages.length} mesaj</div>
                                        </div>

                                        <div className="chat-body" ref={chatScrollRef}>
                                            {messages.length === 0 ? (
                                                <div className="chat-empty">Henüz mesaj yok. İlk mesajı sen yaz! 🚀</div>
                                            ) : messages.map(m => (
                                                <div className="chat-msg" key={m.id}>
                                                    <img
                                                        className={`chat-avatar ${m.role === 'broadcaster' ? 'broadcaster' : ''}`}
                                                        src={channelData.defaultAvatar}
                                                        alt="avatar"
                                                        onError={(e) => { e.target.style.display = 'none'; }}
                                                    />
                                                    <div className="body">
                                                        <div className="row">
                                                            <span className={`who ${m.role === 'broadcaster' ? '' : 'normal'}`}>{m.name}</span>
                                                            {m.role === 'broadcaster' && <span className="badge-owner">YAYINCI</span>}
                                                            <span className="time">{new Date(m.timestamp).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}</span>
                                                        </div>
                                                        <div className="text">{m.text}</div>
                                                    </div>
                                                    {isBroadcaster && <button className="del" onClick={() => deleteMsg(m.id)}>Sil</button>}
                                                </div>
                                            ))}
                                        </div>

                                        <div className="chat-footer">
                                            {!user ? (
                                                <form onSubmit={handleJoin} className="join-form">
                                                    <input
                                                        type="text" name="website" autoComplete="off" tabIndex={-1}
                                                        className="honeypot" value={honeypot}
                                                        onChange={e => setHoneypot(e.target.value)}
                                                    />
                                                    <input type="email" required placeholder="E-posta adresiniz..." value={emailInput} onChange={e => setEmailInput(e.target.value)} />
                                                    <button type="submit" className="btn" disabled={joining}>{joining ? 'Katılınıyor...' : 'Tamam, Sohbete Katıl'}</button>
                                                </form>
                                            ) : (
                                                <>
                                                    <div className="userline">
                                                        <span>Giriş: <b>{user.email}</b>{isBroadcaster && <span className="badge-owner" style={{ marginLeft: 6 }}>YAYINCI</span>}</span>
                                                        <button className="btn-outline" onClick={handleLogout}>Çıkış</button>
                                                    </div>
                                                    <form onSubmit={sendMessage} className="send-row">
                                                        <input
                                                            type="text" name="hp2" autoComplete="off" tabIndex={-1}
                                                            className="honeypot" value={sendHoneypot}
                                                            onChange={e => setSendHoneypot(e.target.value)}
                                                        />
                                                        <input type="text" maxLength={MAX_MESSAGE_LEN} placeholder="Mesajınızı yazın..." value={newMessage} onChange={e => setNewMessage(e.target.value)} />
                                                        <button type="submit" className="btn" disabled={sendingMsg || !newMessage.trim() || cooldownActive}>{sendingMsg ? '...' : 'Gönder'}</button>
                                                    </form>
                                                    <div className="cooldown-bar"><div className="cooldown-fill" style={{ width: `${cooldownPct}%` }}></div></div>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                </Reveal>
                            </div>
                        )}

                        {path === '/hakkinda' && (
                            <Reveal>
                                <div className="glass" style={{ padding: 20 }}>
                                    <h2 style={{ color: 'var(--green)' }}>Hakkında</h2>
                                    <div className="desc-box" style={{ marginTop: 10 }}>
                                        <p>
                                            Selamlar Kankilerim, İsmim Hakan, 38 Yaşındayım. Her akşam canlı yayında sizlerle birlikte WOW oynuyoruz.
                                            Kanalımdaki videoların %60'ı eski akımlar olup şahsıma ait olmayanları sabitlediğim yorumda belirttim.
                                            Video sahibi olan arkadaşlarım kanıtı olduğu takdirde videoları bana ulaşarak kaldırma talebinde bulunabilir 💘
                                        </p>
                                    </div>
                                    <ul style={{ marginTop: 14, color: '#d4d4d8', lineHeight: 1.8, fontSize: 14 }}>
                                        <li>💻 <b>Kullandığım Cihaz:</b> {channelData.device}</li>
                                        <li>⚡ <b>FPS:</b> {channelData.fps}</li>
                                        <li>📩 <b>Reklam ve İşbirliği İçin:</b> <a href={`mailto:${channelData.adminEmail}`} style={{ color: 'var(--green)', fontWeight: 800 }}>{channelData.adminEmail}</a></li>
                                    </ul>
                                    <div className="legal-box">
                                        <b>YASAL UYARI:</b> Her akşam açtığım canlı yayınların ekran kaydını almaktayım. Canlı yayınımda şahsıma edilen küfür/argo kelimelerin gerekli kaydını alarak, küfür edenler hakkında Cumhuriyet Savcılığına suç duyurusunda bulunduğumu lütfen unutmayın 👮
                                        <div style={{ marginTop: 8, color: 'var(--green)', fontWeight: 900 }}>{channelData.slogan}</div>
                                    </div>
                                </div>
                            </Reveal>
                        )}

                        {path === '/videolar' && (
                            <Reveal>
                                <div className="glass" style={{ padding: 20 }}>
                                    <h2 style={{ color: 'var(--green)' }}>🎬 Tüm Videolar ({channelData.totalVideosNum.toLocaleString('tr-TR')})</h2>
                                    <div className="grid2">
                                        {[1, 2, 3, 4, 5, 6].map(i => (
                                            <div className="video-card" key={i}>
                                                <div className="video-thumb">VİCTOR REİS #{i}</div>
                                                <h4 style={{ marginTop: 8, fontSize: 14 }}>WOW Serisi Bölüm {i}</h4>
                                                <div style={{ color: 'var(--muted)', fontSize: 11.5, marginTop: 4 }}>Görüntüleme: 24.5B • Beğeni: 3.2B</div>
                                                <a href="https://www.youtube.com/@Emc%C3%BCkYTB/videos" target="_blank" rel="noreferrer" className="btn" style={{ display: 'block', textAlign: 'center', marginTop: 10 }}>İzle</a>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </Reveal>
                        )}

                        {path === '/profil' && (
                            <Reveal>
                                <div className="glass profile-card" style={{ padding: 22 }}>
                                    <h3 style={{ color: 'var(--green)' }}>Profilim</h3>
                                    {user ? (
                                        <div style={{ marginTop: 14 }}>
                                            <div className="row"><span>👤 Kullanıcı</span><b>{user.name}</b></div>
                                            <div className="row"><span>📩 E-posta</span><b>{user.email}</b></div>
                                            <div className="row"><span>📅 Giriş Tarihi</span><b>{user.joined || 'Bugün'}</b></div>
                                            <div className="row" style={{ borderBottom: 'none' }}><span>🎙️ Yayıncı Modu</span><b style={{ color: isBroadcaster ? 'var(--green)' : 'var(--muted)' }}>{isBroadcaster ? 'Aktif' : 'Kapalı'}</b></div>
                                            <button className="btn" style={{ marginTop: 16, background: 'var(--danger)', color: '#fff' }} onClick={handleLogout}>Çıkış Yap</button>
                                        </div>
                                    ) : (
                                        <div style={{ marginTop: 14 }}>
                                            <p style={{ color: 'var(--muted)' }}>Profilinizi görmek için canlı yayın sohbetinden e-posta ile katılın.</p>
                                            <button className="btn" style={{ marginTop: 12 }} onClick={() => navigate('/canli')}>Canlı Yayına Git</button>
                                        </div>
                                    )}
                                </div>
                            </Reveal>
                        )}
                    </main>

                    <footer className={`site-footer ${footerVisible ? 'visible' : ''}`} aria-hidden={!footerVisible}>
                        <div className="footer-inner">
                            <div className="footer-left">
                                <img src={channelData.logo} alt="logo" onError={(e) => { e.target.onerror = null; e.target.src = channelData.fallbackLogo; }} />
                                <div>
                                    <div className="t1">Marmara Games © - Emcük YTB</div>
                                    <div className="t2">Canlı Yayın & İçerik Platformu</div>
                                </div>
                            </div>
                            <div style={{ textAlign: 'right' }}>
                                <div className="cyber-text">CANLI • EM CÜK</div>
                                <small style={{ display: 'block', marginTop: 4, color: 'var(--muted)', fontSize: 11 }}>{channelData.channelHandle}</small>
                            </div>
                        </div>
                    </footer>

                    <button className="fab" title="Canlı sohbete git" onClick={() => { navigate('/canli'); window.scrollTo(0, 0); }}>💬</button>
                </div>
            );
        }

        const rootEl = document.getElementById('root');
        if (rootEl) {
            createRoot(rootEl).render(<App />);
        } else {
            console.error("Root elementi bulunamadı.");
        }
    </script>
</body>
</html>
