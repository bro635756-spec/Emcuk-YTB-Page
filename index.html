                                    Selamlar Kankilerim İsmim Hakan 38 Yaşındayım Her Akşam Canlı Yayında Sizlerle Birlikte WOW Oynuyoruz. Kanalımda Ki Videolarımın %60'ı Eski Akımlar Olup Şahsıma Ait Olmayanları Sabitlediğim Yorumda Belirttim. Video Sahibi Olan Arkadaşlarım Kanıtı Olduğu Takdirde Videoları Bana Ulaşarak Kaldırma Talebinde Bulunabilir 💘
                                </p>
                                <div style={{marginTop:12,color:'#cbd5e1'}}>Diğer bilgiler:<br/>Türkiye — 26 Haz 2025 tarihinde katıldı — 37,3 B abone — 1.219 video — 19.662.432 görüntüleme</div>
                            </div>
                        )}

                        {path === '/chat' && (
                            <div style={{maxWidth:900,margin:'18px auto'}}>
                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                                    <div>
                                        <h3 style={{color:'#93c5fd'}}>Topluluk Sohbet Odası</h3>
                                        <div style={{color:'#94a3b8',fontSize:13}}>Bot Tarama ve 21 Haneli Güvenlik Sistemi Aktiftir.</div>
                                    </div>
                                    {user && (
                                        <div className="glass-card" style={{display:'flex',gap:10,alignItems:'center'}}>
                                            <div style={{fontSize:12,color:'#cbd5e1'}}>Giriş: <b style={{color:'#7c3aed'}}>{user.email}</b></div>
                                            <button onClick={handleLogout} style={{background:'transparent',border:'1px solid rgba(255,0,0,0.08)',color:'#fb7185',padding:'6px 10px',borderRadius:8}}>Çıkış</button>
                                        </div>
                                    )}
                                </div>

                                {!user ? (
                                    <div className="glass-card" style={{maxWidth:480,margin:'0 auto',textAlign:'center'}}>
                                        <h4 style={{color:'#a78bfa'}}>E-posta ile 21 Haneli Doğrulama</h4>
                                        {step === 1 ? (
                                            <form onSubmit={handleRequestKey} style={{display:'flex',flexDirection:'column',gap:10,marginTop:12}}>
                                                <input type="email" value={emailInput} onChange={e=>setEmailInput(e.target.value)} placeholder="E-posta adresiniz..." required style={{padding:10,borderRadius:10,border:'1px solid rgba(255,255,255,0.04)',background:'rgba(10,10,20,0.6)',color:'#fff'}} />
                                                <div onClick={()=>setCaptchaVerified(!captchaVerified)} style={{cursor:'pointer',padding:12,borderRadius:12,background:captchaVerified?'rgba(16,185,129,0.12)':'rgba(15,23,42,0.6)',border:'1px solid rgba(255,255,255,0.03)'}}>
                                                    <span style={{marginRight:8}}>{captchaVerified ? '✅' : '⬜'}</span>
                                                    <span style={{fontWeight:800}}>{captchaVerified ? 'reCAPTCHA Doğrulandı' : 'Robot Değilim (Tıkla)'}</span>
                                                </div>
                                                <button type="submit" className="btn-primary">21 Haneli Kod Gönder</button>
                                            </form>
                                        ) : (
                                            <form onSubmit={handleVerifyKey} style={{display:'flex',flexDirection:'column',gap:10,marginTop:12}}>
                                                <div style={{color:'#94a3b8',fontSize:13}}>E-postanıza gönderilen 21 haneli anahtarı girin:</div>
                                                <input type="text" value={keyInput} onChange={e=>setKeyInput(e.target.value)} placeholder="21 haneli anahtar..." required style={{padding:10,borderRadius:10,border:'1px solid rgba(255,255,255,0.04)',background:'rgba(10,10,20,0.6)',color:'#fff',fontFamily:'monospace',textAlign:'center'}} />
                                                <button type="submit" className="btn-primary">Doğrula ve Giriş Yap</button>
                                            </form>
                                        )}
                                    </div>
                                ) : (
                                    <div className="glass-card" style={{padding:12}}>
                                        <div style={{height:420,overflowY:'auto',paddingRight:8,borderBottom:'1px solid rgba(255,255,255,0.03)'}}>
                                            {messages.length === 0 ? <p style={{color:'#94a3b8',textAlign:'center',marginTop:40}}>Henüz mesaj yazılmamış. İlk mesajı sen yaz kankam! 🚀</p> :
                                                messages.map(m => (
                                                    <div key={m.id} style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',background:'rgba(0,0,0,0.25)',padding:10,borderRadius:12,marginBottom:8}}>
                                                        <div>
                                                            <div style={{display:'flex',gap:8,alignItems:'center'}}>
                                                                <div style={{fontWeight:800,color:'#7c3aed',fontSize:12}}>{m.name}</div>
                                                                <div style={{fontSize:11,color:'#94a3b8'}}>{new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
                                                            </div>
                                                            <div style={{color:'#e6eefc',marginTop:6}}>{m.text}</div>
                                                        </div>
                                                        {user.email === channelData.adminEmail && <button onClick={()=>deleteMsg(m.id)} style={{background:'rgba(255,0,0,0.06)',color:'#fb7185',border:'none',padding:'6px 8px',borderRadius:8}}>Sil</button>}
                                                    </div>
                                                ))
                                            }
                                        </div>

                                        <form onSubmit={sendMessage} style={{display:'flex',gap:8,marginTop:12}}>
                                            <input type="text" value={newMessage} onChange={e=>setNewMessage(e.target.value)} placeholder="Mesajınızı yazın kankam (Bot taramalı)..." style={{flex:1,padding:10,borderRadius:10,border:'1px solid rgba(255,255,255,0.03)',background:'rgba(10,10,20,0.6)',color:'#fff'}} />
                                            <button className="btn-primary" type="submit">Gönder</button>
                                        </form>
                                    </div>
                                )}
                            </div>
                        )}

                        {path === '/profil' && (
                            <div style={{maxWidth:520,margin:'18px auto'}}>
                                <div className="glass-card" style={{textAlign:'center'}}>
                                    <h3 style={{color:'#a78bfa'}}>Kullanıcı Profilim</h3>
                                    {user ? (
                                        <div style={{textAlign:'left',marginTop:12}}>
                                            <p>👤 <b>Kullanıcı Adı:</b> {user.name}</p>
                                            <p>📩 <b>E-posta:</b> {user.email}</p>
                                            <p>🛡️ <b>Doğrulama:</b> 21 Haneli Anahtar Onaylı</p>
                                            <p>📅 <b>Kayıt Tarihi:</b> {user.joined || "Bugün"}</p>
                                            <button onClick={handleLogout} className="btn-primary" style={{marginTop:12,background:'#ef4444'}}>Çıkış Yap</button>
                                        </div>
                                    ) : (
                                        <div>
                                            <p style={{color:'#94a3b8'}}>Profilinizi görmek için e-posta ile giriş yapmalısınız kankam.</p>
                                            <button onClick={()=>navigate('/chat')} className="btn-primary" style={{marginTop:8}}>Giriş Yap / Kayıt Ol</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {path === '/w/9/videolar-hepsi' && (
                            <div className="glass-card" style={{padding:18}}>
                                <h3 style={{color:'#8b5cf6'}}>🎬 Tüm Videolar ve Eski Akımlar ({channelData.totalVideos} Video)</h3>
                                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:12,marginTop:12}}>
                                    {[1,2,3,4,5,6].map(i => (
                                        <div key={i} style={{background:'rgba(0,0,0,0.35)',padding:12,borderRadius:12}}>
                                            <div style={{height:120,background:'linear-gradient(180deg,#0f172a,#0b1220)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',color:'#a78bfa',fontWeight:900}}>Emcük Video #{i}</div>
                                            <h4 style={{marginTop:8}}>VİCTOR REİS WOW Serisi Bölüm {i}</h4>
                                            <div style={{color:'#94a3b8',fontSize:12}}>Görüntüleme: 24.5B • Beğeni: 3.2B</div>
                                            <a href="https://www.youtube.com/@Emc%C3%BCkYTB/videos" target="_blank" rel="noreferrer" className="btn-primary" style={{display:'block',textAlign:'center',marginTop:8}}>İzle</a>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>

                    <footer className="site-footer" aria-hidden>
                        <div className="footer-inner">
                            <div className="marquee-left">
                                <img src="https://yt3.ggpht.com/RFnm2_4p2Mp-rUk2dDoHTXbULzwueyWp2eVPbgB8RTJz16ybXVOGnoavbAAbU7czvSdr1CkoShUxCg=s640-rw-nd-v1" alt="logo"/>
                                <div>
                                    <div style={{fontWeight:900,color:'#fff'}}>Marmara Games © - Emcük YTB</div>
                                    <div style={{color:'#94a3b8',fontSize:12}}>Canlı Yayın & İçerik Platformu</div>
                                </div>
                            </div>

                            <div style={{textAlign:'right'}} className="footer-right">
                                <div className="cyber-text">CYBERPUNK • EM CÜK</div>
                                <small style={{display:'block',marginTop:6,color:'#94a3b8'}}>VİCTOR REİS DERLER 😇 — {channelData.channelHandle}</small>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
